[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogenmsg"
version = "0.1.0"
description = "Companion code for MSG plasticity with hydrogen trapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.scripts]
hydrogenmsg-figures = "hydrogenmsg.plot.__main__:main"

[tool.setuptools.packages.find]
include = ["hydrogenmsg*"]

[tool.setuptools.package-data]
hydrogenmsg = ["plot/assets/*"]
